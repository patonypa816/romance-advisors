<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>御书房 · OBS 画面</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11100e;color:#b6aa98;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent}
    #standby{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
    #standby[hidden]{display:none}
    #audioControl{position:absolute;left:12px;bottom:12px;z-index:2;border:1px solid #b6aa98;border-radius:6px;padding:9px 12px;background:#fff9ec;color:#30291f;cursor:pointer}
    #audioControl[hidden]{display:none}
    .badge{position:absolute;right:14px;bottom:12px;padding:4px 8px;border-radius:4px;background:#11100e99;color:#e5d7bd;font-size:12px;pointer-events:none}
  </style>
</head>
<body>
  <video id="remote" autoplay playsinline muted></video>
  <div id="standby" role="status">等待工作台启动数字人</div>
  <button id="audioControl" type="button" hidden>开启声音</button>
  <span class="badge">AI 生成</span>
  <!-- 保护代码必须先于 SDK 安装；播放器只接收远端音画。 -->
  <script src="player.js"></script>
  <script src="sdk.js"></script>
</body>
</html>
