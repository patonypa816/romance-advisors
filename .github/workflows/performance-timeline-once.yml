name: One-shot real performance timeline capture
on:
  push:
    branches: ['codex/test-performance-timeline-20261103']
    paths: ['.github/workflows/performance-timeline-once.yml']
permissions:
  contents: read
concurrency:
  group: performance-timeline-once-20261103
  cancel-in-progress: false
jobs:
  capture:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'test: authorize fixed-script timeline capture 20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing Studio dependencies
        run: |
          python -m pip install --index-url https://pypi.org/simple -r avatar-studio/requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Real Bailian preparation and local Vidu protocol capture only
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          BAILIAN_WORKSPACE_ID: ${{ vars.BAILIAN_WORKSPACE_ID }}
        run: python -B avatar-studio/tools/capture_performance_timeline_once.py
      - name: Upload sanitized text evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-timeline-text-only
          path: performance-timeline-result.json
          if-no-files-found: warn
          retention-days: 7
