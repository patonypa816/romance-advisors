name: M1 and M2 PostgreSQL and browser acceptance
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  # A PR update supersedes a matching branch run instead of repeating expensive tests.
  group: m1-m2-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hell_inc_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: hell_inc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hell_inc_test -d hell_inc_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Ephemeral service credentials, never used for any external database.
      HELL_INC_DATABASE_URL: postgresql+asyncpg://hell_inc_test:isolated_ci_only@127.0.0.1:5432/hell_inc_test
      PYTHONPATH: ${{ github.workspace }}/src
      PIP_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install exact Python requirements
        run: python -m pip install -r requirements-lock.txt
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --registry=https://registry.npmjs.org
      - name: Build production frontend
        run: npm run build --prefix frontend
      - name: Apply migration explicitly (including repeat safety)
        run: |
          python -m hell_inc migrate
          python -m hell_inc migrate
      - name: Contract, PostgreSQL transaction and API tests
        run: python -m unittest discover -s tests -v
      - name: Install Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Real browser to built frontend to API to PostgreSQL
        run: npm run test:e2e --prefix frontend
      - name: M2 manual evaluation fixture browser acceptance (not real model evidence)
        working-directory: frontend
        run: npx --no-install playwright test --config ../tests/e2e/playwright.m2.config.ts
      - name: Save browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-m2-browser-evidence
          path: |
            playwright-report/
            test-results/
            playwright-report-m2/
            test-results-m2/
          if-no-files-found: ignore
          retention-days: 7
