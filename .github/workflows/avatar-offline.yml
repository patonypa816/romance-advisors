name: Avatar offline preparation checks
on:
  push:
    branches: ['codex/avatar-*', 'codex/m4-game-performance', main]
    paths: ['avatar-studio/**', '.github/workflows/avatar-offline.yml']
  pull_request:
    paths: ['avatar-studio/**', '.github/workflows/avatar-offline.yml']
permissions:
  contents: read
concurrency:
  group: avatar-offline-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies from PyPI
        run: python -m pip install --index-url https://pypi.org/simple -r avatar-studio/requirements.txt
      - name: Install audio tools for offline media tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Credential mapping tests with dummy values only
        working-directory: avatar-studio/studio
        run: python -B -m unittest test_credentials_env test_bailian_config test_connection_compat
      - name: Current Studio readiness, audio and stop regressions (offline)
        working-directory: avatar-studio/studio
        run: >-
          python -B -m unittest test_live_preflight test_stop_evidence_failure test_tts_alignment test_bailian_ai
          test_semantic_speech test_semantic_ai test_action_schema test_semantic_integration
          test_semantic_transport test_dialogue_a_transport test_director test_director_execution
          test_topic_generation test_performance_tasks test_fixed_replay test_semantic_replay test_studio
          test_long_action_replay.LongActionReplayTests.test_invalid_actions_short_audio_and_text_have_zero_writes
          test_long_speech_integration.LongSpeechIntegrationTests.test_120_char_one_tts_and_pcm_delivery_archive_and_usage
          test_long_speech_transport.LongSpeechTransportTests.test_invalid_text_structure_and_audio_have_zero_writes
      - name: Studio game expression display (offline)
        run: node --test avatar-studio/studio/test_app_ui.mjs
      - name: Mocked preparation and SDK fetch tests
        working-directory: avatar-studio
        run: |
          python -B -m unittest discover -s tools -p test_cloud_prepare.py
          python -B -m unittest discover -s tools -p test_performance_cli.py
      - name: Shell syntax
        run: |
          sh -n avatar-studio/tools/prepare_cloud.sh
          sh -n avatar-studio/tools/fetch_vendor.sh
