[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hell-inc"
version = "0.1.0"
description = "HELL INC isolated M1 player records"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.4", "SQLAlchemy==2.0.46", "asyncpg==0.31.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
